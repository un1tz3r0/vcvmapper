name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          cd /home/build/rack-plugin-toolchain
          make plugin-build-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: /home/build/rack-plugin-toolchain/plugin-build/*.vcvplugin

  build-mac:
    name: mac-${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
          - arch: arm64
            target: arm64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-mac-${{ matrix.arch }}.zip"
          unzip -q sdk.zip -d "$HOME"
      - name: Build
        run: |
          brew list zstd >/dev/null 2>&1 || brew install zstd
          make -j3 dist RACK_DIR="$HOME/Rack-SDK" CROSS_COMPILE=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*.vcvplugin
